<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrouveTaMusique</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <header class="header">
    <div class="wordmark">TrouveTaMusique <span class="tag" id="tag-etape">6 questions, ton style</span></div>
  </header>

  <main class="page">
    <!-- ÉCRAN QUIZ -->
    <section id="quiz" class="card">
      <div class="progress"><div id="progress-barre"></div></div>
      <p class="compteur" id="compteur"></p>
      <h2 id="question-libelle"></h2>
      <div id="options"></div>
      <div id="artiste-bloc" class="hidden">
        <input id="artiste-input" class="texte" type="text" autocomplete="off">
        <button id="btn-fini" class="primaire">Voilà, trouve-moi ça →</button>
      </div>
    </section>

    <!-- ÉCRAN RÉSULTATS -->
    <section id="resultats" class="hidden">
      <div id="styles-grille" class="styles"></div>
      <ul id="raisons" class="raisons hidden"></ul>
      <p id="note-raffinage" class="hidden"></p>
      <div id="pistes"></div>
      <button id="btn-recommencer" class="lien-bas">↺ recommencer le quiz</button>
    </section>
  </main>

  <audio id="lecteur" preload="none"></audio>

  <footer class="footer">Extraits de 30 s via Deezer (gratuit, sans compte) —
  boutons j'aime/j'aime pas pour affiner. Tout tourne sur ton PC.</footer>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
